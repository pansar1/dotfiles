# ==========================
# Starship: Modern Pimped Prompt
# ==========================

# General
add_newline = false

# --------------------------
# Prompt format
# --------------------------
format = """
$username$hostname $directory$git_branch$git_status$cmd_duration$time
$character
"""

# --------------------------
# Prompt character
# --------------------------
[character]
success_symbol = "[❯](bold #a6e3a1)"     # catppuccin green
error_symbol   = "[❯](bold #f38ba8)"     # catppuccin red
vicmd_symbol   = "[❮](bold #f9e2af)"     # catppuccin yellow
format = "$symbol "

# --------------------------
# Directory
# --------------------------
[directory]
style = "bold #89dceb"          # catppuccin sky
truncation_length = 3
truncate_to_repo = false
read_only = " "
read_only_style = "dimmed #f38ba8"

# --------------------------
# Git branch
# --------------------------
[git_branch]
symbol = " "
style = "bold #cba6f7"           # catppuccin mauve
only_attached = true
format = "[$symbol$branch]($style) "

# --------------------------
# Git status
# --------------------------
[git_status]
style = "dimmed #f9e2af"         # catppuccin yellow
format = '([$all_status$ahead_behind]($style) )'
conflicted = "!"
staged = "+"
modified = "~"
renamed = "»"
deleted = "x"
untracked = "?"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"

# --------------------------
# Command duration
# --------------------------
[cmd_duration]
min_time = 2000
style = "dimmed #fab387"         # catppuccin peach
format = "[$duration]($style) "

# --------------------------
# Time
# --------------------------
[time]
disabled = false
time_format = "%H:%M"
format = "[$time]($style) "
style = "dimmed #89b4fa"         # catppuccin blue

# --------------------------
# User
# --------------------------
[username]
show_always = false
format = "[$user]($style) "
style_user = "bold #cba6f7"      # catppuccin mauve

# --------------------------
# Host
# --------------------------
[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "bold #cba6f7"           # catppuccin mauve

# --------------------------
# Disabled modules
# --------------------------
[battery]
disabled = true
[docker_context]
disabled = true
[package]
disabled = true
[nodejs]
disabled = true
[rust]
disabled = false
[golang]
disabled = true
[python]
disabled = true
[kubernetes]
disabled = true
[aws]
disabled = true
[gcloud]
disabled = true
