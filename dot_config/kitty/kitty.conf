# =============================================================================
# Kitty Terminal Configuration
# =============================================================================

# --- Fonts ---
font_family      Hack Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# Slightly increase line spacing for readability
adjust_line_height  2
adjust_column_width 0

# --- Cursor ---
cursor_shape           block
cursor_blink_interval  0

# --- Scrollback ---
scrollback_lines 10000

# --- Mouse ---
# Open URLs with cmd+click
open_url_with default

# --- Window ---
remember_window_size   yes
initial_window_width   220c
initial_window_height  50c
window_padding_width   8

# macOS: native title bar
hide_window_decorations no
macos_titlebar_color    system

# --- Colors: Catppuccin Mocha (official theme) ---
include catppuccin-mocha.conf

macos_option_as_alt     left

# --- Tab Bar ---
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      "{index}: {title}"
active_tab_font_style   bold

# --- Bell ---
enable_audio_bell no
visual_bell_duration 0.0

# --- Performance ---
repaint_delay    10
input_delay      3
sync_to_monitor  yes

# --- Shell Integration ---
shell_integration enabled

# --- Key Mappings ---
# Use cmd+t / cmd+w for tabs (familiar macOS shortcuts)
map cmd+t new_tab_with_cwd
map cmd+w close_tab
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab

# Split panes
map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current

# Navigate panes
map cmd+[ neighboring_window left
map cmd+] neighboring_window right

# Font size
map cmd+equal change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0     change_font_size all 0
